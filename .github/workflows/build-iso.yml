name: Build HavokOS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap squashfs-tools xorriso \
            isolinux syslinux-common syslinux-utils \
            grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools fakeroot cpio

      - name: Build HavokOS ISO
        run: sudo bash build/build.sh

      - name: Verify ISO exists
        run: |
          ls -lh output/HavokOS-*.iso
          file output/HavokOS-*.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: havokos-iso
          path: output/HavokOS-*.iso
          retention-days: 7

      - name: Delete old release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ver in v1.0.0 v1.0.1 v1.0.2 v1.0.3 v1.0.4 v1.0.5 v1.0.6 v1.1.0; do
            gh release delete $ver --yes --cleanup-tag 2>/dev/null || true
            git push origin :refs/tags/$ver 2>/dev/null || true
          done

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: HavokOS v1.1.0
          body: |
            # HavokOS v1.1.0 — Complete Build System Rewrite
            
            ## Root Cause Fix
            The "Attempted to kill init!" panic was caused by `/sbin/init` pointing to **systemd** instead of sysvinit. The kernel package (`linux-image-amd64`) was installed in the same apt call as `sysvinit-core`, so systemd (installed by debootstrap) remained the init system. Systemd then crashed in the live CD environment (no cgroups/journald in squashfs+overlay).
            
            ## What Changed (v3.0 build script)
            - **sysvinit-core installed FIRST** in a separate apt call before the kernel, so it properly owns `/sbin/init`
            - **systemd pinned to priority -1** via apt preferences — prevents any package from reinstalling it
            - **elogind + libpam-elogind** added — provides logind D-Bus API without systemd (needed for polkit, lightdm, NM)
            - **orphan-sysvinit-scripts** added — fills gaps where packages dropped sysvinit support
            - **Build verifies `/sbin/init`** is NOT a systemd symlink after all installs
            - **machine-id cleaned** before squashfs (prevents D-Bus conflicts across boots)
            - **python3-gi-cairo + gir1.2-gtksource-4** added for HSL syntax highlighting
            - **procps** added for system monitoring tools
            
            ## App Fixes
            - Browser: fixed Gdk import crash (was imported too late)
            - Desktop: fixed Pango import crash (was imported too late)
            - Desktop: HSL interpreter now actually loads (was copied to wrong path)
            - Settings: replaced systemctl power commands with sysvinit equivalents
            
            ## Features
            - Lightweight desktop environment (Openbox)
            - Havok Browser, Files, Text Editor, and Settings apps
            - HSL (.hsl) scripting for full customization
            - HavokCustom folder on desktop for user extensions
            - IMPORTANT subfolder with desktop/app HSL definitions
            
            ## How to Run
            Download the ISO and run in QEMU:
            ```
            qemu-system-x86_64 -cdrom HavokOS-1.0.0.iso -m 1024 -accel tcg
            ```
            
            Make sure to allocate at least 1024MB RAM with `-m 1024`.
          files: output/HavokOS-*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
